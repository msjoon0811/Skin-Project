model:
  name: efficientnet_b0
  pretrained: true

data:
  img_dir: data/raw/aihub/images
  label_dir: data/raw/aihub/labels
  img_size: 224
  batch_size: 32
  num_workers: 4

train:
  epochs: 50
  lr: 0.0005
  optimizer: adam
  scheduler: cosine
  save_path: checkpoints/multitask_best.pth

loss:
  reg_weight: 1.0
  cls_weight: 2.0

augmentation:
  flip: true
  color_jitter: 0.1
  rotation: 10
  random_crop: true
