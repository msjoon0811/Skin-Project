model:
  name: efficientnet_b0
  pretrained: true
  num_classes: 3  # 단일 속성 3-class

data:
  img_dir: data/raw/aihub/images
  label_dir: data/raw/aihub/labels
  target_col: oiliness_class
  img_size: 224
  batch_size: 32
  num_workers: 4

train:
  epochs: 30
  lr: 0.001
  optimizer: adam
  scheduler: reduce_on_plateau
  save_path: checkpoints/baseline_best.pth

augmentation:
  flip: true
  color_jitter: 0.1
  rotation: 10
  random_crop: true
